[package]
name = "hub_router"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "hub_router"
path = "src/main.rs"
